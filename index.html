<!-- NAVBAR PRINCIPAL RESPONSIVA (MOBILE PERSONALIZADO) -->
    <header class="max-w-5xl mx-auto px-3 sm:px-6 pt-4 sm:pt-5 pb-3 sm:pb-4 border-b border-white/10 mb-4 sm:mb-6">
        <!-- Estrutura no Mobile: Flex-col; Estrutura no Desktop: Flex-row space-between -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-2.5 sm:gap-0">
            
            <!-- LINHA 1 (MOBILE) / ESQUERDA (DESKTOP): INSTAGRAM LOGO -->
            <div class="flex items-center gap-1.5 sm:gap-2 select-none justify-center sm:justify-start w-full sm:w-auto">
                <i class="fa-brands fa-instagram text-pinkAccent text-2xl sm:text-3xl"></i>
                <span class="font-serif font-extrabold text-lg sm:text-2xl tracking-wide text-pinkAccent">isabellamendesstudio</span>
            </div>

            <!-- LINHA 2 (MOBILE) / DIREITA (DESKTOP): BOTÕES DE CONTA E MEUS NÚMEROS -->
            <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-2">
                <!-- Botão de Conta à Esquerda no Mobile -->
                <div id="userInfoHeader" class="hidden text-xs sm:text-sm text-pinkAccent bg-transparent px-2.5 sm:px-3.5 py-1 rounded-full border border-pinkAccent/40 items-center gap-1.5">
                    <i id="userRoleIcon" class="fa-solid fa-user-check text-pinkAccent text-xs"></i>
                    <span id="userNameDisplay" class="font-semibold truncate max-w-[100px] sm:max-w-none"></span>
                    <button onclick="logoutUser()" class="text-pinkAccent/70 hover:text-pinkAccent underline ml-1 text-[10px] sm:text-xs">(Sair)</button>
                </div>

                <!-- Botão Meus Números à Direita no Mobile -->
                <button id="myNumbersNavBtn" onclick="openModal('myNumbersModal')" class="text-xs sm:text-sm bg-transparent hover:bg-white/5 px-3.5 sm:px-4 py-1 rounded-full text-pinkAccent border border-pinkAccent/40 transition flex items-center gap-1.5 ml-auto sm:ml-0">
                    <i class="fa-solid fa-magnifying-glass text-pinkAccent text-xs"></i> <span>Meus Números</span>
                </button>
            </div>

        </div>
    </header>
